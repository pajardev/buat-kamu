<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Untuk Kamu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(to right, #ffe0ec, #e0f7fa);
      font-family: sans-serif;
      overflow: hidden;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .float-anim {
      animation: float 2.5s ease-in-out infinite;
    }

    .envelope {
      width: 200px;
      height: 150px;
      background: #f472b6;
      position: relative;
      margin: 100px auto 0;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      border: 2px solid #f472b6;
      transition: 0.5s ease;
    }

    .flap {
      width: 0;
      height: 0;
      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 75px solid #f472b6;
      position: absolute;
      top: -75px;
      left: 0;
      z-index: 10;
      transition: 0.5s ease;
    }

    .letter {
      position: absolute;
      width: 180px;
      height: 120px;
      background: #ffe4f2;
      top: 15px;
      left: 10px;
      padding: 20px;
      text-align: center;
      font-size: 20px;
      color: #d63384;
      border-radius: 8px;
      transform: translateY(100%);
      opacity: 0;
      transition: 0.5s ease;
    }

    .open .flap {
      transform: rotateX(180deg);
    }

    .open .letter {
      transform: translateY(0);
      opacity: 1;
    }

    .flower {
      width: 100px;
      margin: 30px auto 0;
      opacity: 0;
      transform: scale(0);
      transition: 1s ease;
    }

    .open .flower {
      opacity: 1;
      transform: scale(1);
    }

    .petal {
      position: fixed;
      width: 20px;
      height: 20px;
      background: pink;
      border-radius: 50%;
      opacity: 0.7;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body class="text-center">

  <h1 class="text-3xl mt-10 text-pink-700 font-semibold">Tekan Amplop 💌</h1>

  <!-- Amplop dengan animasi -->
  <div class="envelope float-anim" onclick="openEnvelope()" id="envelope">
    <div class="flap"></div>
    <div class="letter">
      <p>I Love You Sayang, tekan tombol bawah 😘</p>
    </div>
  </div>

  <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Bunga" class="flower" id="flower">

  <!-- Audio (musik romantis) -->
  <audio id="loveMusic" src="musik.mp3"></audio>

  <!-- Tombol -->
  <a href="bunga.html" target="_blank" onclick="playMusic(event)">
    <button class="mt-8 px-6 py-3 bg-pink-500 text-white font-semibold rounded-full shadow-lg hover:bg-pink-600 transition float-anim">
      Klik di sini ya sayang 💕
    </button>
  </a>

  <!-- Efek kelopak bunga -->
  <script>
    function openEnvelope() {
      const envelope = document.getElementById('envelope');
      envelope.classList.toggle('open');
    }

    function createPetal() {
      const petal = document.createElement("div");
      petal.classList.add("petal");
      petal.style.left = Math.random() * 100 + "vw";
      petal.style.animationDuration = 2 + Math.random() * 3 + "s";
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 5000);
    }

    setInterval(createPetal, 300);

    function playMusic(event) {
      const music = document.getElementById('loveMusic');
      music.play();
      // Lanjutkan ke link setelah sedikit delay (biar musik sempat terdengar)
      setTimeout(() => {
        window.open("bunga.html", "_blank");
      }, 100);
      event.preventDefault(); // Hindari langsung buka link sebelum musik main
    }
  </script>

</body>
</html>
